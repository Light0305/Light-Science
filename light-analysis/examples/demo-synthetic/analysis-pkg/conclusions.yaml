boundaries:
- claim_id: C1
  conditions: 判定只覆盖本执行包的 6 个留出段与 root_seed=42 确定性派生口径；段集、种子政策或数据版本变化后，须经新执行包 → 新分析包重新判定，本包判定不外推。
  not_extrapolatable: 输入为合成自签执行包（数据 turkey-barn-repro-v3 为合成集），本包全部判定只验证 Analysis
    判定链路本身，不构成对任何真实数据的结论。
  would_change_if: 在同一冻结判据下扩大独立重复层级样本（更多留出段）后重开分析包——校正后 p 与 TOST 区间随之收窄，本次未过门的各行才有重新落字的材料基础。
limitations:
- SESOI 在合成 design 中只有文本形态（判读标准原文『差 ≤2 点』），本包的结构化快照来自演示转写件（inputs/design-sesoi-source.json）；原生结构化
  SESOI 应由 Design 侧在登记行给出，已生成 standard_gap 回流条目。
- 段级配对结构未被 v1 计算集建模：各行处理/对照取自同一批留出段，工具按独立样本口径（Welch）计算，标准误偏大、判定偏保守；R-FIX 行处理/对照为同一分布的两次执行产物，逐段数值完全相同，等价区间仍按独立口径展开。
- 段内种子层变异未进入判定：n 按独立重复层级（视频段）计为 6，段内 3 个种子先均值化；段内变异只在 Experiment 事实层留痕。
- 校正族退化：登记行未带 claim_ref，校正族退化为单族 claim:all（BH-FDR），族口径粗于按主张分族（承接期已落字）。
- 固定阈值臂段间离散大（spread 5.717，seg-04 低至 62.187）是各行标准误的主要来源；该事实在 Experiment 对账层已留痕，分析期不做事后剔除。
- 跨模型复核缺位：本环境为单模型家族，复核走 REVIEW_UNAVAILABLE 显式通道，结论包停在 delivered 之前（blocked），未做执行者代判。
