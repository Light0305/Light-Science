[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "light-experiment"
version = "1.0.0"
description = "Light-Experiment：按冻结设计书执行实验——逐 run 留全痕、与预期登记逐行对账（Light-Science 子技能）"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
light-experiment = "light_experiment.cli:main"

[tool.setuptools]
packages = ["light_experiment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
