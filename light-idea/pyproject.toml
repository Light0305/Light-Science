[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "light-idea"
version = "1.0.0"
description = "light-idea：把领域缺口变成经得起查新的定版想法卡（Light-Science 子技能）"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
light-idea = "light_idea.cli:main"

[tool.setuptools]
packages = ["light_idea"]

[tool.setuptools.package-data]
light_idea = ["casebook_seeds.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
