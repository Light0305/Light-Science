manuscript:
  title: Abnormal turkey behaviour detection in intensive farming using computer vision
  abstract: We present a computer-vision method for detecting abnormal behaviour of
    turkeys in commercial barns. A multi-object tracker follows individual birds in
    top-view video; video-level statistics predict per-tracklet decision thresholds
    without per-video manual tuning, and abnormal events (piling, huddling, prolonged
    immobility) are flagged for stockperson review. On a multi-barn benchmark the
    method matches an oracle per-video tuned baseline while requiring no manual threshold
    setting.
  keywords:
  - turkey
  - abnormal behaviour detection
  - computer vision
  - multi-object tracking
  - precision livestock farming
