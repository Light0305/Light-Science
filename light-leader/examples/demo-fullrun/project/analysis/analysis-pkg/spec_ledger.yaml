- point: estimator
  options:
  - name: mean_diff
    valid: true
  - name: median_diff
    valid: true
  theoretical_justification: 登记判据与 SESOI 均以段级均值差定义，主估计量取 Welch 均值差（mean_diff）；中位差配
    Mann-Whitney 秩检验（median_diff）为稳健替代，检验判定对估计量选择的敏感性，两者回答同一 estimand（段级 MOTA 的处理-对照差）
- point: outlier_handling
  options:
  - name: keep_all
    valid: true
  - name: trim_extremes
    valid: true
  theoretical_justification: 独立重复层级仅 6 段且无预注册剔除规则，主口径全段保留（keep_all）；极值段截尾（trim_extremes）只作敏感性留痕——v1
    计算口径不随该决策点改变（见 README 已知局限），登记它是为了让自由度使没使过逐项可查
