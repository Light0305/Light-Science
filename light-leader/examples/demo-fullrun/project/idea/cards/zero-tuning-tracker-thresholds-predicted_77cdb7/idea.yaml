idea_id: zero-tuning-tracker-thresholds-predicted_77cdb7
title: Zero-tuning tracker thresholds predicted from video-level statistics
one_liner: 用视频级统计量回归跟踪关联阈值，免逐集人工扫描
status: pre_mortem_passed
operator: evolution_chain
provenance:
  chain_id: CH-2cd7ae29
  path_string: SORT'16 → ByteTrack'22 → Zhang et al.'25 （附录 A 逐时长阈值扫描=断点 BP1）→ 本想法
  combo: null
  note: Literature 精读卡第 16 节候选 1 与此同源，链断点为据
