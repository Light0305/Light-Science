facets:
  purpose:
    phrase: tracker deployment without per-video threshold tuning
    detail: 种子论文三个关联阈值须按视频时长逐集扫描选定（附录 A），部署到新视频没有现成取值；部署层三代跟踪改进都没碰。
    source:
      type: paper
      doi: 10.1016/j.compag.2025.110856
      title: Abnormal turkey behaviour detection using self-supervised video anomaly
        detection and multiple object tracking
  mechanism:
    phrase: regress association thresholds from video-level statistics
    detail: 以视频级统计量（轨迹长度分布、检测置信分布、目标密度）为输入回归 θ_modIoU / θ_high / θ_low 三阈值。
    source:
      type: chain_node
      chain_id: CH-2cd7ae29
      node: N5
  evaluation:
    phrase: leave-one-video-out MOTA versus per-video oracle thresholds
    detail: 留一视频交叉验证：预测阈值的 MOTA 对照逐段神谕扫描（上限）与固定阈值（下限）。
    source:
      type: user
body:
  method_steps:
  - 在多段视频上复现附录 A 的逐段阈值扫描，得到（视频统计量 → 最优三阈值）样本
  - 拟合小型回归器（统计量只取视频前段，部署时不许用未来帧）
  - 新视频推理时由前段统计量直接给出三阈值，零人工调参跑跟踪
  - 留一视频交叉验证对账神谕上限与固定阈值下限
  hypothesis: 视频级统计量与最优关联阈值之间存在稳定映射，可学且可迁移到留出视频
  mechanism_rationale: 阈值本质是检测质量与遮挡强度的折中，而这两者都体现在轨迹长度、置信分布与密度统计里——统计量是阈值的因，逐集扫描只是在逐段重测这个因。
  unexpected_prediction: 只用视频前 30 秒统计量预测的阈值，效果不差于用全程统计量——若成立，部署可在视频开头即完成标定
  contribution_type: method
feasibility:
  compute_within_budget: true
  compute_note: 回归器拟合可忽略；成本在逐段扫描样本生成与跟踪重跑，单卡约 30 GPU 小时，与种子论文单台 RTX5000 条件对齐
  data_obtainable: true
  data_note: 作者数据未公开（原文声明无共享许可）→ 自建 6 段火鸡视频复现集；方法可先在公开 MOT 集上验证再回领域
exec_spec:
  datasets:
  - name: 自建火鸡栏舍复现集
    version: 6 段视频（2.5/5 分钟各 3）
    access: 自建采集（种子作者数据未公开）
  - name: MOT17 train
    version: 公开基准
    access: 公开下载（仅方法先行验证，不作领域结论）
  strongest_baseline:
    name: 种子论文附录 A 的逐视频神谕阈值扫描协议（上限对照）；固定阈值取种子 2.5 分钟组取值（下限对照）
    doi: 10.1016/j.compag.2025.110856
  metrics:
  - name: MOTA
    convention_source: MOTChallenge 与种子论文口径
  - name: IDF1
    convention_source: MOTChallenge 与种子论文口径
  - name: HOTA
    convention_source: HOTA 原文（IJCV 2020）与种子论文口径
  ablations:
  - 去掉轨迹长度分布特征
  - 去掉检测置信分布特征
  - 去掉目标密度特征
  - 回归器换常数预测（固定阈值对照）
  - 只用前 30 秒统计量 vs 全程统计量
  resource_budget:
    gpu_hours: 30
    data: 自建 6 段 + MOT17
    weeks: 3
  key_details:
  - 三阈值联合回归而非逐个独立回归（附录 A 显示三者耦合）
  - 统计量只许用视频前段
  - 留一视频交叉验证，禁止在留出段上调回归器超参
  discriminating_experiment:
    description: 6 段自建视频上留一交叉验证：其余 5 段的（统计量→神谕θ）样本训练回归器，预测留出段三阈值并跑 Byte³Track
    readout_positive: 留出段 MOTA 达神谕值 98% 以内（差 ≤2 点）且全面优于固定阈值：映射成立，进 Design
    readout_negative: 任一留出段 MOTA 低于固定阈值基线：统计量→阈值映射不存在，假设为假，回炉 facet
    readout_null: 与固定阈值差 <1 点且距神谕 >2 点：判别力不足，先扩样本段数再判，不许直接宣称成立
negative:
  strongest_objection: 审稿人会说：你只有 6 段视频，回归器学的不过是「时长→阈值」的查表，而附录 A 本来就按时长给了两组数——增量为零
  risks:
  - 主导阈值的变量可能是时长之外的场景因素（密度/光照/遮挡率），统计量未覆盖时预测失效
  - 自建复现集与作者数据分布不一致，结论外推受限
  why_not_selected_first: ''
pre_mortem:
  date: '2026-10-20'
  checklist:
    strongest_baseline_attack:
      status: pass
      note: 对照双锚：上限=种子附录 A 逐视频神谕扫描，下限=固定阈值。最狠的攻击是「6 段视频下回归器只学到时长查表」——已预置反制：特征消融含去掉一切时长代理特征后仍须成立，且自建集刻意取
        2.5/5 分钟混合时长、神谕θ在同等时长段间仍有差异，查表解释不掉
    metric_convention:
      status: pass
      note: MOTA/IDF1/HOTA 均为 MOTChallenge 与种子论文正文口径（原文 S062 的定义与文献指针），无自创指标；约定来源已逐个写入
        exec_spec.metrics
    ablations_complete:
      status: pass
      note: 核心主张有两条：①统计量→阈值映射存在——由常数预测消融对账（映射不存在时回归应不优于常数）；②多特征组各有贡献——三组特征各有对应消融行；③前段统计量足够——30
        秒 vs 全程消融直接对应该子主张
    resources_realistic:
      status: pass
      note: 30 GPU 小时主要花在逐段神谕扫描的样本生成与留一重跑；种子论文同等管线在单台 RTX5000 服务器上完成全套实验，本预算与其条件对齐；3
        周含自建 6 段视频采集与标注校验
    null_result_learning:
      status: pass
      note: 零结果（优于固定阈值但距神谕远）的学习已预写：统计量集不足以决定阈值，结论转为「逐集调参为何不可避免」的诊断——判别实验 readout_null
        已把这种情况与阴性分开，不许硬宣称成立
    method_instantiable:
      status: pass
      note: 第三方可照卡执行：输入=三组视频级统计量（只用视频前段）、输出=三阈值联合回归、验证=留一视频交叉、对照=神谕/固定双锚、判读=三分法；歧义点（三阈值联合而非独立回归）已在
        key_details 写死
  open_items: []
