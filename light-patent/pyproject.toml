[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "light-patent"
version = "1.0.0"
description = "light-patent：科研成果的权利固化出口——公开审计、交底挖掘、查新、撰写、审核、答复与静态台账（Light-Science 子技能，v1 只做中国发明专利）"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
render = ["python-docx>=1.0"]

[project.scripts]
light-patent = "light_patent.cli:main"

[tool.setuptools]
packages = ["light_patent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
